name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build executable
        shell: powershell
        run: .\build.ps1

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: AltPrtScnCapture-windows
          path: dist/AltPrtScnCapture.exe
          if-no-files-found: error
